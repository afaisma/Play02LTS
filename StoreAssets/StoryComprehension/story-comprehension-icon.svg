<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><g><rect width="100" height="100" fill="#4DA3F0"/><g transform="translate(0.0 0.0) scale(1.0)">
